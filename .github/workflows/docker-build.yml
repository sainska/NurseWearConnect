name: Docker Build and Deploy

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Determine Version Increment
        id: bump_type
        run: |
          MSG=$(git log -1 --pretty=%B)
          if [[ $MSG == *"[major]"* ]]; then
            echo "type=major" >> $GITHUB_OUTPUT
          elif [[ $MSG == *"[minor]"* ]]; then
            echo "type=minor" >> $GITHUB_OUTPUT
          else
            echo "type=patch" >> $GITHUB_OUTPUT
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Auto-Increment Version
        run: |
          chmod +x gradlew
          ./gradlew incrementVersion -PincType=${{ steps.bump_type.outputs.type }}
          
      - name: Commit version change
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add version.properties
          git commit -m "chore(version): auto-increment [skip ci]" || echo "No changes to commit"
          git push origin master || echo "Push failed, continuing build..."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Extract version from version.properties
        id: version_info
        run: |
          MAJOR=$(grep VERSION_MAJOR version.properties | cut -d'=' -f2)
          MINOR=$(grep VERSION_MINOR version.properties | cut -d'=' -f2)
          PATCH=$(grep VERSION_PATCH version.properties | cut -d'=' -f2)
          echo "version=$MAJOR.$MINOR.$PATCH" >> $GITHUB_OUTPUT

      - name: Build Docker image
        run: |
          docker build -t nursewear-connect:${{ steps.version_info.outputs.version }} -t nursewear-connect:latest .
          
      - name: Run Build and Upload
        run: |
          docker run --rm nursewear-connect:latest
